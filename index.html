<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#143b36">
    <meta name="description" content="Informes temporales sobre localidades y sus servicios cercanos.">
    <link rel="manifest" href="manifest.json">
    <title>Atlas Local</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        try {
            if (localStorage.getItem('atlas-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        } catch { }
    </script>
</head>

<body>
    <main class="app-shell">
        <header class="topbar">
            <div class="brand-mark" aria-hidden="true">AL</div>
            <div>
                <p class="eyebrow">Investigación local</p>
                <h1>Atlas Local</h1>
            </div>
            <button class="icon-button" id="theme-button" title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">◐</button>
            <button class="icon-button" id="clear-button" title="Borrar investigación"
                aria-label="Borrar investigación">×</button>
        </header>

        <section class="search-panel" aria-labelledby="search-title">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Nueva ficha</p>
                    <h2 id="search-title">Conoce una localidad</h2>
                </div>
                <label class="privacy-toggle" for="history-toggle">
                    <input type="checkbox" id="history-toggle">
                    <span class="switch" aria-hidden="true"></span>
                    <span class="privacy-note" id="privacy-note">Sin almacenamiento</span>
                </label>
            </div>
            <form id="location-form">
                <label>País<input id="country" name="country" placeholder="Italia" autocomplete="country-name"
                        required></label>
                <label>Provincia, región o estado<input id="region" name="region" placeholder="Trentino-Alto Adige"
                        autocomplete="address-level1"></label>
                <label>Localidad<input id="place" name="place" placeholder="Borgo Valsugana"
                        autocomplete="address-level2" required></label>
                <button class="primary-button" type="submit"><span>Generar informe</span><span
                        aria-hidden="true">→</span></button>
            </form>
            <p class="form-status" id="form-status" role="status"></p>
            <div class="history-chips hidden" id="history-chips" aria-label="Búsquedas recientes"></div>
        </section>

        <section class="empty-state" id="empty-state">
            <div class="compass" aria-hidden="true">✦</div>
            <h2>Una mirada amplia,<br>en un solo informe.</h2>
            <p>Datos geográficos, clima y servicios próximos con sus fuentes para que puedas comparar lugares con
                criterio.</p>
        </section>

        <section class="report hidden" id="report" aria-live="polite"></section>
    </main>
    <script src="app.js"></script>
</body>

</html>
